# pty-tester difference registry (SEED, I02).
#
# Intentionally MINIMAL: only per-run path/sandbox normalization. There are
# NO sanctioned MOTD/logo/version/glyph classes — today's known divergences
# (MOTD art, `❯` glyph, `⎿` tool transcript, footer model string) must
# surface as unknown-candidate lines. That candidate list IS the parity
# program's work list; pin a new class here only when the OWNER has ruled
# the difference out of scope (see README, "Pinning a new class").
classes:
  # Footer/status cwd lines: each app runs in its own staged sandbox
  # (…/run-<n>/sandbox/<app>), so those lines differ per app and per run.
  # Path noise, not a rendering difference.
  - name: staged-sandbox-path
    pattern: 'sandbox/(pi|tart)-run-\d+'
  # Any reference to the per-run staging root (footer cwd lines). Truncation
  # tolerant: a 120-col pane cuts the line anywhere in the tail, so the class
  # anchors only on the stable per-run 'run-<n>/' segment.
  - name: parity-run-path
    pattern: 'run-\d+/'
