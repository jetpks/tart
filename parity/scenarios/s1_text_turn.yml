# S1 — plain text turn (I01 spike): both apps get the same fixed reply.
# One mock request per app.
#
# Footer staging (I16): the mock model's provider label — pi reads it off
# the staged models.json (its catalog exposes >1 provider, so the footer
# renders the `(mock) mock-1` form); the port resolves the same fact
# through TART_MODEL_PROVIDER. Reasoning needs no staging: the mock model
# declares reasoning: false and the port's fallback model is not
# reasoning-capable either.
name: s1_text_turn
prompt: "hello"
expected_requests: 1
responses:
  - type: stream
    content: "The mock reply is fixed and short for the spike."
env:
  tart:
    TART_MODEL_PROVIDER: mock
