name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported minor, from the floor (required_ruby_version) to
        # the dev version; mise resolves each to its latest patch.
        ruby: ["3.4", "4.0"]
    env:
      BUNDLE_PATH: vendor/bundle
      MISE_RUBY_VERSION: ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: bundle-ruby-${{ matrix.ruby }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: bundle-ruby-${{ matrix.ruby }}-
      # Scoped suite — deliberately not the Rakefile's full test task:
      # its FileList also pulls gems/tui-split-rig/test/**, which needs a
      # local pinned pi clone that GitHub runners do not have.
      - run: bundle install
      - run: bundle exec ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].sort.each { |f| require File.expand_path(f) }'
