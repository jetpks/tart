name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported minor, from the floor (required_ruby_version) to
        # the dev version; mise resolves each to its latest patch.
        ruby: ["3.4", "4.0"]
    env:
      # NOTE: deliberately NO BUNDLE_PATH / vendor-bundle caching here.
      # tart's I73 child-env law scrubs bundler's exported env from every
      # spawned child; children then resolve gems from the ruby's DEFAULT
      # paths. Vendored gems (vendor/bundle) are invisible to that lookup
      # and starve every child that boots tart code on a clean runner.
      #
      # TERM/COLORTERM: rendering + theme tests resolve truecolor hexes;
      # without an explicit truecolor-capable TERM the runner's default
      # degrades every color to a 256-palette index and the parity
      # assertions see 102 instead of "#7e888e".
      MISE_RUBY_VERSION: ${{ matrix.ruby }}
      TERM: xterm-256color
      COLORTERM: truecolor
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4   # installs the mise.toml tools (fd) + the matrix ruby
      - run: bundle install
      - run: bundle exec ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].sort.each { |f| require File.expand_path(f) }'
